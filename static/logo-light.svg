<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 96" fill="none">
	<defs>
		<linearGradient id="dd-logol-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#ffffff" />
			<stop offset="100%" stop-color="#f1f5f9" />
		</linearGradient>
		<linearGradient id="dd-logol-grad2" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#f8fafc" />
			<stop offset="100%" stop-color="#e2e8f0" />
		</linearGradient>
	</defs>

	<!-- Brand Mark (left) -->
	<g transform="translate(10, 0)">
		<!-- Domino 2 -->
		<g transform="translate(62, 51) rotate(24)">
			<rect x="-12" y="-25" width="24" height="50" rx="5.5" fill="url(#dd-logol-grad2)" stroke="#cbd5e1" stroke-width="1.5" />
			<line x1="-8" y1="0" x2="8" y2="0" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round" />
			<circle cx="0" cy="-12" r="3.6" fill="#d97706" />
			<line x1="0" y1="8" x2="-5" y2="16" stroke="#cbd5e1" stroke-width="1.2" />
			<line x1="0" y1="8" x2="5" y2="16" stroke="#cbd5e1" stroke-width="1.2" />
			<circle cx="0" cy="8" r="2.6" fill="#0284c7" />
			<circle cx="-5" cy="16" r="2.6" fill="#0284c7" />
			<circle cx="5" cy="16" r="2.6" fill="#0284c7" />
		</g>

		<!-- Cascade Impact Arc -->
		<path d="M37 31 C 45 27, 54 31, 62 37" stroke="#e11d48" stroke-width="1.6" stroke-dasharray="2.5 2" opacity="0.8" />

		<!-- Domino 1 -->
		<g transform="translate(35, 47) rotate(-14)">
			<rect x="-14" y="-29" width="28" height="58" rx="6.5" fill="#64748b" opacity="0.12" transform="translate(1.5, 2)" />
			<rect x="-14" y="-29" width="28" height="58" rx="6.5" fill="url(#dd-logol-grad1)" stroke="#334155" stroke-width="1.8" />
			<line x1="-10" y1="0" x2="10" y2="0" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round" />

			<line x1="0" y1="-14" x2="-7" y2="14" stroke="#94a3b8" stroke-width="1.4" />
			<line x1="0" y1="-14" x2="7" y2="14" stroke="#94a3b8" stroke-width="1.4" />
			<line x1="-7" y1="14" x2="7" y2="14" stroke="#cbd5e1" stroke-width="1" />

			<circle cx="0" cy="-14" r="6.5" fill="#f43f5e" opacity="0.2" />
			<circle cx="0" cy="-14" r="4.5" fill="#e11d48" />
			<circle cx="0" cy="-14" r="1.6" fill="#ffffff" />

			<circle cx="-7" cy="14" r="3.6" fill="#0284c7" />
			<circle cx="7" cy="14" r="3.6" fill="#0284c7" />
		</g>
	</g>

	<!-- Wordmark and Subtitle -->
	<g transform="translate(100, 0)">
		<text x="0" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="25" font-weight="700" fill="#0f172a" letter-spacing="-0.025em">
			Dependency <tspan fill="#0284c7">Domino</tspan>
		</text>
		<text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#64748b" letter-spacing="0.1em">
			SUPPLY CHAIN IMPACT ANALYSIS
		</text>
